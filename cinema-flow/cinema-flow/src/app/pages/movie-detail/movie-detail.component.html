<section class="detail-page">
  <button mat-button (click)="goBack()" class="back-btn">
    <mat-icon>arrow_back</mat-icon>
    返回
  </button>

  <div *ngIf="movie; else notFound">
    <mat-card class="movie-detail-card">
      <div class="content-grid">
        <img [src]="movie.posterUrl || fallbackPoster" [alt]="movie.title" class="movie-poster" />

        <div class="movie-info">
          <h1>{{ movie.title }}</h1>
          <p class="meta">
            <mat-icon>person</mat-icon>
            导演：{{ movie.director }}
          </p>
          <p class="meta">
            <mat-icon>calendar_today</mat-icon>
            上映日期：{{ movie.releaseDate | date: 'yyyy年MM月dd日' }}
          </p>

          <div class="rating-box">
            <span class="score">{{ movie.rating | number: '1.1-1' }}</span>
            <span class="label">{{ movie.rating | ratingLevel }}</span>
            <span class="watch-status" [class.done]="movie.isWatched">
              {{ movie.isWatched ? '已观影' : '未观影' }}
            </span>
          </div>
        </div>
      </div>

      <mat-divider></mat-divider>

      <mat-card-actions align="end">
        <a mat-raised-button color="primary" routerLink="/movies">
          <mat-icon>list</mat-icon>
          返回列表
        </a>
        <button mat-raised-button color="warn" (click)="deleteMovie()">
          <mat-icon>delete</mat-icon>
          删除
        </button>
      </mat-card-actions>
    </mat-card>

    <div class="navigation-buttons">
      <button mat-stroked-button *ngIf="prevMovieId" [routerLink]="['/movies', prevMovieId]">
        <mat-icon>chevron_left</mat-icon>
        上一部
      </button>
      <span class="spacer"></span>
      <button mat-stroked-button *ngIf="nextMovieId" [routerLink]="['/movies', nextMovieId]">
        下一部
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>

  <ng-template #notFound>
    <mat-card class="not-found">
      <mat-card-content>
        <mat-icon color="warn">error_outline</mat-icon>
        <h2>电影未找到</h2>
        <p>该电影可能已被删除或 ID 不正确。</p>
        <a mat-raised-button color="primary" routerLink="/movies">返回电影列表</a>
      </mat-card-content>
    </mat-card>
  </ng-template>
</section>
