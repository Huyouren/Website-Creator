<section class="page-shell">
  <header class="page-header">
    <p class="kicker">Create New Entry</p>
    <h1>添加新电影</h1>
    <p class="lead">
      本页现在受路由守卫保护。登录后可以为新电影选择已有导演和类型，提交后列表页、导演详情页和仪表盘都会同步刷新。
    </p>
    <div class="header-flags">
      <span>服务调用闭环</span>
      <span>导演实体关联</span>
      <span>分类路由支持</span>
      <span>响应式状态同步</span>
    </div>
  </header>

  <mat-card class="form-card">
    <mat-card-content>
      <form #movieForm="ngForm" (ngSubmit)="onSubmit()" class="movie-form">
        <div class="form-grid">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>电影名称</mat-label>
            <input matInput [(ngModel)]="newMovie.title" name="title" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>导演</mat-label>
            <mat-select
              [(ngModel)]="newMovie.directorId"
              name="directorId"
              (ngModelChange)="onDirectorChange($event)"
              required
            >
              <mat-option *ngFor="let director of directors" [value]="director.id">
                {{ director.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>上映日期</mat-label>
            <input
              matInput
              [matDatepicker]="picker"
              [(ngModel)]="newMovie.releaseDate"
              name="releaseDate"
              required
            />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>海报 URL</mat-label>
            <input matInput [(ngModel)]="newMovie.posterUrl" name="posterUrl" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>电影类型</mat-label>
            <mat-select [(ngModel)]="newMovie.genre" name="genre" required>
              <mat-option *ngFor="let genre of genres" [value]="genre">
                {{ genre }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <p class="helper-text" *ngIf="newMovie.director">
          当前将关联到导演实体：{{ newMovie.director }}
        </p>

        <div class="slider-field">
          <label for="rating-input">评分：{{ newMovie.rating | number: '1.1-1' }}</label>
          <mat-slider min="0" max="10" step="0.1" showTickMarks>
            <input
              id="rating-input"
              matSliderThumb
              [(ngModel)]="newMovie.rating"
              name="rating"
            />
          </mat-slider>
        </div>

        <div class="toggle-row">
          <mat-slide-toggle [(ngModel)]="newMovie.isWatched" name="isWatched">
            已观影
          </mat-slide-toggle>
          <span class="toggle-hint">打开后会在列表中标记为“已观影”。</span>
        </div>

        <div class="form-error" *ngIf="errorMsg">
          <mat-icon>error_outline</mat-icon>
          <p>{{ errorMsg }}</p>
        </div>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/movies">取消</button>
          <button mat-button type="button" (click)="resetForm()">重置</button>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="saving || !movieForm.form.valid"
          >
            <mat-icon>{{ saving ? 'hourglass_top' : 'save' }}</mat-icon>
            {{ saving ? '保存中...' : '保存' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
