<section class="page-shell">
  <header class="page-header">
    <p class="kicker">Create New Entry</p>
    <h1>添加新电影</h1>
    <p class="lead">
      提交表单后会调用状态中心的新增方法，完成后列表页、首页和仪表盘都会立即看到最新结果。
    </p>
    <div class="header-flags">
      <span>服务调用闭环</span>
      <span>响应式状态同步</span>
      <span>最终跳转详情页</span>
    </div>
  </header>

  <mat-card class="form-card">
    <mat-card-content>
      <form #movieForm="ngForm" (ngSubmit)="onSubmit()" class="movie-form">
        <div class="form-grid">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>电影名称</mat-label>
            <input matInput [(ngModel)]="newMovie.title" name="title" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>导演</mat-label>
            <input matInput [(ngModel)]="newMovie.director" name="director" required />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>上映日期</mat-label>
            <input
              matInput
              [matDatepicker]="picker"
              [(ngModel)]="newMovie.releaseDate"
              name="releaseDate"
              required
            />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>海报 URL</mat-label>
            <input matInput [(ngModel)]="newMovie.posterUrl" name="posterUrl" />
          </mat-form-field>
        </div>

        <div class="slider-field">
          <label for="rating-input">评分：{{ newMovie.rating | number: '1.1-1' }}</label>
          <mat-slider min="0" max="10" step="0.1" showTickMarks>
            <input
              id="rating-input"
              matSliderThumb
              [(ngModel)]="newMovie.rating"
              name="rating"
            />
          </mat-slider>
        </div>

        <div class="toggle-row">
          <mat-slide-toggle [(ngModel)]="newMovie.isWatched" name="isWatched">
            已观影
          </mat-slide-toggle>
          <span class="toggle-hint">打开后会在列表中标记为“已观影”。</span>
        </div>

        <div class="form-error" *ngIf="errorMsg">
          <mat-icon>error_outline</mat-icon>
          <p>{{ errorMsg }}</p>
        </div>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/movies">取消</button>
          <button mat-button type="button" (click)="resetForm()">重置</button>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="saving || !movieForm.form.valid"
          >
            <mat-icon>{{ saving ? 'hourglass_top' : 'save' }}</mat-icon>
            {{ saving ? '保存中...' : '保存' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
